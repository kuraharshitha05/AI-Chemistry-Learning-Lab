<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz | AI Chemistry Learning Lab</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <main class="container page-shell">
    <header>
      <div>
        <h1>Chemistry Quiz</h1>
        <p>Practice with short, interactive chemistry questions.</p>
      </div>
      <a class="button" href="../index.html">Back Home</a>
    </header>

    <div class="card">
      <form id="quiz-form">
        <h2 id="quiz-question">Quiz question will appear here.</h2>
        <div id="quiz-choices"></div>
        <div style="display:flex; align-items:center; gap:0.75rem; margin-top:1rem; flex-wrap:wrap;">
          <button type="submit">Submit Answer</button>
          <button type="button" id="next-question">Next Question</button>
        </div>
      </form>
      <div id="quiz-result"></div>
    </div>
  </main>

  <script src="../script.js"></script>
</body>
</html>
